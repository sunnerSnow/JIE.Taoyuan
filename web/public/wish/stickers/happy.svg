<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160"><title>小企鵝貼圖：開心</title><defs>
  <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="sticker" x="-15%" y="-15%" width="130%" height="130%">
    <feMorphology in="SourceAlpha" operator="dilate" radius="5" result="fat"/>
    <feGaussianBlur in="fat" stdDeviation="2.4" result="blur"/>
    <feOffset in="blur" dy="2.5" result="drop"/>
    <feFlood flood-color="#0B3D3A" flood-opacity="0.22"/>
    <feComposite in2="drop" operator="in" result="shadow"/>
    <feFlood flood-color="#FFFFFF"/>
    <feComposite in2="fat" operator="in" result="outline"/>
    <feMerge><feMergeNode in="shadow"/><feMergeNode in="outline"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs><g filter="url(#sticker)"><g filter="url(#rough)"><g transform="translate(0 -6)"><g transform="rotate(5 80 96)"><path d="M53 104 Q34 104 26 94 Q36 90 55 98Z" fill="#2E2B2A"/><path d="M107 104 Q126 104 134 94 Q124 90 105 98Z" fill="#2E2B2A"/><ellipse cx="80" cy="114" rx="30" ry="27" fill="#2E2B2A"/><ellipse cx="80" cy="119" rx="21" ry="19" fill="#9FD6C4"/><ellipse cx="68" cy="141" rx="9.5" ry="5" fill="#F4A43C"/><ellipse cx="92" cy="141" rx="9.5" ry="5" fill="#F4A43C"/><circle cx="63" cy="44" r="9.5" fill="#2E2B2A"/><circle cx="76" cy="38" r="11" fill="#2E2B2A"/><circle cx="90" cy="40" r="9.5" fill="#2E2B2A"/><circle cx="100" cy="47" r="7" fill="#2E2B2A"/><path d="M68 39 q6 -7 13 -1 M84 37 q6 -6 12 1" fill="none" stroke="#6A625E" stroke-width="2" stroke-linecap="round"/><circle cx="80" cy="72" r="36" fill="#2E2B2A"/><ellipse cx="80" cy="80" rx="28.5" ry="24" fill="#FFFDF7"/><circle cx="69" cy="74" r="9.5" fill="#FFFFFF" stroke="#3B3634" stroke-width="2.4"/><circle cx="91" cy="74" r="9.5" fill="#FFFFFF" stroke="#3B3634" stroke-width="2.4"/><path d="M78.5 74 q1.5 -2.2 3 0" fill="none" stroke="#3B3634" stroke-width="2.2"/><polygon points="69.0,69.8 70.4,73.1 73.9,73.4 71.2,75.7 72.1,79.2 69.0,77.3 65.9,79.2 66.8,75.7 64.1,73.4 67.6,73.1" fill="#F9D53A" stroke="#2E2B2A" stroke-width="1.2" stroke-linejoin="round"/><polygon points="91.0,69.8 92.4,73.1 95.9,73.4 93.2,75.7 94.1,79.2 91.0,77.3 87.9,79.2 88.8,75.7 86.1,73.4 89.6,73.1" fill="#F9D53A" stroke="#2E2B2A" stroke-width="1.2" stroke-linejoin="round"/><ellipse cx="59" cy="88" rx="6" ry="3.6" fill="#F4A0A0" opacity="0.85"/><ellipse cx="101" cy="88" rx="6" ry="3.6" fill="#F4A0A0" opacity="0.85"/><path d="M72 88 Q80 92 88 88 Q86 97 80 98 Q74 97 72 88Z" fill="#D9742B"/><path d="M70 85 Q80 78 90 85 Q80 90 70 85Z" fill="#F4A43C"/><path d="M55 102 Q80 113 105 102 L104 109 Q80 120 56 109Z" fill="#3E9B5F"/><path d="M71 113 L81 128 L88 113Z" fill="#3E9B5F"/></g></g><path d="M58 152 q22 6 44 0" fill="none" stroke="#B9C9C7" stroke-width="3" stroke-linecap="round"/><path d="M30 30 Q31.08 34.92 36 36 Q31.08 37.08 30 42 Q28.92 37.08 24 36 Q28.92 34.92 30 30Z" fill="#F9D53A"/><path d="M132 27 Q133.26 32.74 139 34 Q133.26 35.26 132 41 Q130.74 35.26 125 34 Q130.74 32.74 132 27Z" fill="#F9D53A"/></g></g></svg>
