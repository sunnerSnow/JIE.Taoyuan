troke-linecap="round"/></g><path d="M109.9 20.9 L101.4 17.8" stroke="#F2B705" stroke-width="3" stroke-linecap="round"/><path d="M117.7 12.4 L113.9 4.2" stroke="#F2B705" stroke-width="3" stroke-linecap="round"/><path d="M130.3 12.4 L134.1 4.2" stroke="#F2B705" stroke-width="3" stroke-linecap="round"/><path d="M138.1 20.9 L146.6 17.8" stroke="#F2B705" stroke-width="3" stroke-linecap="round"/></g></g></svg>
